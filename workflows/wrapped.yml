name: Update Developer Wrapped

on:
  schedule:
    - cron: "0 18 * * *" # every day, 18:00 UTC
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate dashboard
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          TZ_OFFSET: "5.5" # Sri Lanka (UTC+5:30)
          MASK_PRIVATE: "true" # private repos show as "private"
        run: python scripts/generate_wrapped.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dev-wrapped.svg
          git diff --cached --quiet || git commit -m "chore: update developer wrapped"
          git push
